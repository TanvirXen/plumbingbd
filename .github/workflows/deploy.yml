# Builds the site on every push to main and publishes the result to the "deploy" branch.
# The server (89.116.121.51) checks that branch every minute and goes live with new builds
# (deploy/eps-pull.sh). Nothing connects into the server, so its SSH can stay limited to your IP.
# Secret (set once by deploy/setup-cicd.sh): ENV_FILE = the site's .env file.
name: Build for server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-deploy-branch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check ENV_FILE secret
        id: check
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::warning::ENV_FILE secret is not set yet; run deploy/setup-cicd.sh once. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.check.outputs.ready == 'true'
        run: npm ci

      - name: Build
        if: steps.check.outputs.ready == 'true'
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env
          npm run build
          test -f dist/index.html

      - name: Publish to the deploy branch
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$RUNNER_TEMP/deploy-branch"
          mkdir -p "$out" && cp -a dist "$out/site"
          # Admin repo: the orders API (api/) goes along, with its node_modules, for the server to run
          if [ -f api/package.json ]; then
            (cd api && npm ci --omit=dev --no-audit --no-fund)
            cp -a api "$out/api"
          fi
          # Stop Vercel from building this branch (it only holds built files).
          echo '{ "git": { "deploymentEnabled": false } }' > "$out/vercel.json"
          printf 'Built from %s (%s)\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > "$out/BUILD.txt"
          cd "$out"
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          # One commit only: the branch never grows.
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
          echo "Published build of ${GITHUB_SHA::7} to the deploy branch; the server goes live within about a minute." >> "$GITHUB_STEP_SUMMARY"
